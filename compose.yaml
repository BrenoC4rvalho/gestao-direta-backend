services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=gestaodireta'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=gestaodireta'
    ports:
      - '5432'

  ollama:
    image: 'ollama/ollama:latest'
    container_name: gestao-direta-ollama
    ports:
      - '11434:11434'
    volumes:
      - 'ollama_data:/root/.ollama'
    restart: unless-stopped

volumes:
  ollama_data:
