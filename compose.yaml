services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestaodireta
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: gestaodireta
    ports:
      - "5432"
    networks:
      - gestao-direta-network

  ollama:
    image: ollama/ollama:latest
    container_name: gestao-direta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

    dns:
      - 8.8.8.8
      - 1.1.1.1

    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    networks:
      - gestao-direta-network
    restart: unless-stopped

networks:
  gestao-direta-network:
    name: gestao-direta-network
    driver: bridge

volumes:
  ollama_data: