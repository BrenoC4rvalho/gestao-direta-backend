services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gestaodireta
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: gestaodireta
    ports:
      - "5432:5432"
    networks:
      - gestao-direta-network

  ollama:
    image: ollama/ollama:latest
    container_name: gestao-direta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

    dns:
      - 8.8.8.8
      - 1.1.1.1

    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    networks:
      - gestao-direta-network
    restart: unless-stopped

  transcription-whisper:
    build: ./services/transcription-whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-pt}
      WHISPER_MAX_UPLOAD_SIZE_MB: ${WHISPER_MAX_UPLOAD_SIZE_MB:-10}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-1}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - whisper_huggingface_cache:/root/.cache/huggingface
    networks:
      - gestao-direta-network
    restart: unless-stopped

networks:
  gestao-direta-network:
    name: gestao-direta-network
    driver: bridge

volumes:
  ollama_data:
  whisper_huggingface_cache:
