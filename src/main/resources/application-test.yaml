spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  info:
    java:
      enabled: true
info:
  app:
    name: Gestao Direta API
    description: Backend API for Gestao Direta
    version: 0.0.1-SNAPSHOT
    java-version: 21

app:
  ai:
    financial-extraction:
      enabled: false
      model: ""
      timeout-seconds: 20
      minimum-confidence: 0.60
      diagnostic-only: false
    provider: fake
    ollama:
      base-url: http://localhost:11434
      model: llama3.1:8b
      format: json
      temperature: 0
    gemini:
      api-key: test-gemini-key
      model: gemini-3.1-flash-lite
    health:
      enabled: true
      timeout-seconds: 5
      cache-seconds: 60
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin
  jwt:
    issuer: gestao-direta-api-test
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-minutes: 60
    remember-me-expiration-days: 15
  auth:
    password-recovery:
      code-expiration-minutes: 10
      max-attempts: 5
      request-window-minutes: 15
      max-requests-per-window: 3
  cookie:
    name: gd_session
    secure: false
    same-site: Lax

messaging:
  telegram:
    enabled: false
    bot-token: test-token
    webhook-secret: test-secret
    api-base-url: http://localhost
