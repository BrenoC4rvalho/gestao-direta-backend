spring:
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  info:
    java:
      enabled: true
info:
  app:
    name: Gestao Direta API
    description: Backend API for Gestao Direta
    version: 0.0.1-SNAPSHOT
    java-version: 21

app:
  ai:
    provider: fake
    ollama:
      base-url: http://localhost:11434
      model: llama3.1:8b
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin
  jwt:
    issuer: gestao-direta-api-test
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-minutes: 60
  cookie:
    name: gd_session
    secure: false
    same-site: Lax
