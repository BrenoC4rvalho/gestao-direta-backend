spring.config.import: "optional:file:.env[.properties]"

spring:
  application:
    name: gestao-direta-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  info:
    java:
      enabled: true

info:
  app:
    name: Gestao Direta API
    description: Backend API for Gestao Direta
    version: 0.0.1-SNAPSHOT
    java-version: 21

server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: framework

app:
  transcription:
    provider: ${APP_TRANSCRIPTION_PROVIDER:gemini}
    whisper:
      base-url: ${APP_TRANSCRIPTION_WHISPER_BASE_URL:http://localhost:8090}
      timeout: ${APP_TRANSCRIPTION_WHISPER_TIMEOUT:120s}
  telegram:
    audio-debug:
      save-enabled: ${APP_TELEGRAM_AUDIO_DEBUG_SAVE_ENABLED:false}
      directory: ${APP_TELEGRAM_AUDIO_DEBUG_DIRECTORY:telegram-audio-debug}
  ai:
    audio-transcription:
      enabled: ${APP_AI_AUDIO_TRANSCRIPTION_ENABLED:true}
      model: ${APP_AI_AUDIO_TRANSCRIPTION_MODEL:gemini-3.1-flash-lite}
      max-duration-seconds: ${APP_AI_AUDIO_TRANSCRIPTION_MAX_DURATION_SECONDS:60}
      max-size-mb: ${APP_AI_AUDIO_TRANSCRIPTION_MAX_SIZE_MB:10}
      timeout-seconds: ${APP_AI_AUDIO_TRANSCRIPTION_TIMEOUT_SECONDS:30}
      debug-response: ${APP_AI_AUDIO_TRANSCRIPTION_DEBUG_RESPONSE:false}
      debug-response-directory: ${APP_AI_AUDIO_TRANSCRIPTION_DEBUG_RESPONSE_DIRECTORY:telegram-audio-debug}
    financial-extraction:
      enabled: ${AI_FINANCIAL_EXTRACTION_ENABLED:false}
      model: ${AI_FINANCIAL_EXTRACTION_MODEL:}
      timeout-seconds: ${AI_FINANCIAL_EXTRACTION_TIMEOUT_SECONDS:20}
      minimum-confidence: ${AI_FINANCIAL_EXTRACTION_MINIMUM_CONFIDENCE:0.60}
      diagnostic-only: ${AI_FINANCIAL_EXTRACTION_DIAGNOSTIC_ONLY:false}
    provider: ${APP_AI_PROVIDER:ollama}
    ollama:
      base-url: ${APP_AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${APP_AI_OLLAMA_MODEL:llama3.2:3b}
      format: ${APP_AI_OLLAMA_FORMAT:json}
      temperature: ${APP_AI_OLLAMA_TEMPERATURE:0}
    gemini:
      api-key: ${APP_AI_GEMINI_API_KEY:}
      model: ${APP_AI_GEMINI_MODEL:gemini-3.1-flash-lite}
    health:
      enabled: ${AI_HEALTH_CHECK_ENABLED:true}
      timeout-seconds: ${AI_HEALTH_CHECK_TIMEOUT_SECONDS:5}
      cache-seconds: ${AI_HEALTH_CHECK_CACHE_SECONDS:60}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Telegram-Bot-Api-Secret-Token

  jwt:
    issuer: gestao-direta-api
    secret: ${APP_JWT_SECRET:change-this-secret-in-production-change-this-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
    remember-me-expiration-days: ${APP_JWT_REMEMBER_ME_EXPIRATION_DAYS:15}

  auth:
    password-recovery:
      code-expiration-minutes: ${PASSWORD_RECOVERY_CODE_EXPIRATION_MINUTES:10}
      max-attempts: ${PASSWORD_RECOVERY_MAX_ATTEMPTS:5}
      request-window-minutes: ${PASSWORD_RECOVERY_REQUEST_WINDOW_MINUTES:15}
      max-requests-per-window: ${PASSWORD_RECOVERY_MAX_REQUESTS_PER_WINDOW:3}

  cookie:
    name: gd_session
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

messaging:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}

  conversation:
    expiration-hours: ${MESSAGING_CONVERSATION_EXPIRATION_HOURS:24}

logging:
  level:
    br.com.gestaodireta.messaging.service.TelegramVoiceMessageProcessor: DEBUG