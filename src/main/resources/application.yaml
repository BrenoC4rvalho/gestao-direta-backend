spring.config.import: "optional:file:.env[.properties]"

spring:
  application:
    name: gestao-direta-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true
  info:
    java:
      enabled: true

info:
  app:
    name: Gestao Direta API
    description: Backend API for Gestao Direta
    version: 0.0.1-SNAPSHOT
    java-version: 21

server:
  port: 8080
  servlet:
    context-path: /api
  forward-headers-strategy: framework

app:
  ai:
    provider: ${APP_AI_PROVIDER:ollama}
    ollama:
      base-url: ${APP_AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${APP_AI_OLLAMA_MODEL:llama3.2:3b}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Telegram-Bot-Api-Secret-Token

  jwt:
    issuer: gestao-direta-api
    secret: ${APP_JWT_SECRET:change-this-secret-in-production-change-this-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}

  cookie:
    name: gd_session
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}

messaging:
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}

  conversation:
    expiration-hours: ${MESSAGING_CONVERSATION_EXPIRATION_HOURS:24}