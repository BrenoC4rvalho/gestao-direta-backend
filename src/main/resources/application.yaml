spring:
  application:
    name: gestao-direta-api

  datasource:
    url: jdbc:postgresql://localhost:5432/gestaodireta
    username: gestaodireta
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: gestao-direta-api
    secret: ${APP_JWT_SECRET:change-this-secret-in-production-change-this-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
  cookie:
    name: gd_session
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
